general {
    lock_cmd = pidof hyprlock || hyprlock
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10; powerprofilesctl set power-saver
    on-resume = brightnessctl -r; powerprofilesctl set performance

}

listener {
    timeout = 600
    on-timeout = hyprlock
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
