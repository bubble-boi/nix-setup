# BACKGROUND
background {
    monitor =
    path = $HOME/.current_wallpaper
    blur_passes = 3
    blur_size = 8
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%A, %B %d')</b>"
    font_family = Noto Sans
    font_size = 24
    position = 0, 35%
    halign = center
    valign = center
    color = rgba(242, 243, 244, 0.75)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_boost = 1.2
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    font_family = Noto Sans
    font_size = 120
    position = 0, 30%
    halign = center
    valign = center
    color = rgba(242, 243, 244, 0.75)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_boost = 1.2
}

# INPUT
input-field {
    monitor =
    size = 100%, 5%
    position = 0, 0
    halign = center
    valign = center
    placeholder_text =
    check_text =
    fail_text = $FAIL
    font_color = rgba(242, 243, 244, 0.75)
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    check_color = rgba(242, 243, 244, 0.5)
    fail_color = rgba(242, 143, 144, 0.75)
    outline_thickness = 0
    swap_font_color = true
}

# ICON
image {
    path = ~/.icon
    size = 120
    position = 0, -30%
    halign = center
    valign = center
    rounding = -1
    border_size = 0
}

# NAME
label {
    text = Jiang McQueen
    font_family = Noto Sans
    font_size = 20
    position = 0, -35%
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_boost = 1.2
}
