set -g mouse on

set -g status-interval 0
set -g status-position bottom
set -g status-style bg=default
set -g status 2
set -g status-format[0] ''
set -g status-format[1] ' #[bg=colour002,fg=colour000] #{?client_prefix,<PREFIX>,<ROOT>} #[default]#[fg=colour002]#[default]#[bg=colour002,fg=colour000] #S:#P #[default]#[fg=colour002]#[default]#[bg=colour002,fg=colour000] #(basename "#{pane_current_path}")/ #[default]#[fg=colour002]#(tmux-git-status "#{pane_current_path}")#[fg=colour002]#[default]#[align=right]#[fg=colour004]#[fg=colour004]#[bg=colour004,fg=colour000] #(tmux-sys-status -c -i exit) '

set -g synchronize-panes off
bind a set synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n M-N split-window -v -c "#{pane_current_path}"

